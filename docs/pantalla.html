<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Pantalla · Gran Bingo Municipal</title>
  <style>
    * { box-sizing: border-box; }
    html { background: #0b1026; }
    body {
      margin: 0; min-height: 100vh; overflow: hidden;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #f1f5f9;
      background-color: #0b1026;
      background-image:
        radial-gradient(ellipse at 50% -10%, rgba(124, 58, 237, .45), transparent 60%),
        radial-gradient(ellipse at 100% 100%, rgba(225, 29, 72, .28), transparent 55%),
        radial-gradient(ellipse at 0% 80%, rgba(37, 99, 235, .25), transparent 50%),
        linear-gradient(rgba(255, 255, 255, .045) 2px, transparent 2px),
        linear-gradient(90deg, rgba(255, 255, 255, .045) 2px, transparent 2px),
        linear-gradient(160deg, #1e1b4b 0%, #0b1026 55%, #1a0b2e 100%);
      background-size: auto, auto, auto, 56px 56px, 56px 56px, auto;
    }
    header {
      height: 11vh; display: flex; align-items: center; justify-content: space-between; padding: 0 2.5vw;
      background: linear-gradient(90deg, rgba(37, 99, 235, .85), rgba(124, 58, 237, .85), rgba(225, 29, 72, .85));
      box-shadow: 0 4px 18px rgba(0, 0, 0, .45); border-bottom: .5vh solid #fbbf24;
    }
    header .titulo { font-size: 5.2vh; font-weight: 900; letter-spacing: .1vw; text-shadow: 0 .3vh .8vh rgba(0, 0, 0, .5); }
    header .info { font-size: 3vh; font-weight: 800; color: #fde68a; text-align: right; }
    header .bolitas { display: flex; gap: .8vh; }
    header .bolitas span {
      width: 5vh; height: 5vh; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
      font-size: 2.6vh; font-weight: 900; color: #0f172a;
      background: radial-gradient(circle at 50% 50%, #fff 0 45%, transparent 47%), var(--c);
      box-shadow: inset -.4vh -.4vh .6vh rgba(0, 0, 0, .3), 0 .3vh .5vh rgba(0, 0, 0, .4);
    }
    #juego { height: 89vh; display: grid; grid-template-columns: 34vw 1fr; gap: 2vw; padding: 2.2vh 2vw; }
    .panel {
      background: rgba(15, 23, 42, .86); border: .25vh solid rgba(251, 191, 36, .45); border-radius: 2vh;
      box-shadow: 0 1vh 3vh rgba(0, 0, 0, .5);
    }
    #izquierda { display: grid; grid-template-rows: auto auto minmax(0, 1fr); gap: 1.8vh; min-height: 0; }
    #izquierda .panel, #tableroPanel { overflow: hidden; }
    #actualPanel { padding: 1.6vh 2vh; text-align: center; }
    #actualPanel .rotulo { font-size: 3vh; font-weight: 800; color: #fde68a; }
    .bolaGrande {
      width: 31vh; height: 31vh; margin: 1vh auto 0; border-radius: 50%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: radial-gradient(circle at 50% 50%, #fff 0 54%, transparent 55.5%), var(--c, #475569);
      box-shadow: inset -2vh -2vh 3vh rgba(0, 0, 0, .35), inset 1.5vh 1.5vh 3vh rgba(255, 255, 255, .25), 0 1.5vh 4vh rgba(0, 0, 0, .6);
      color: #0f172a; font-weight: 900;
    }
    .bolaGrande .l { font-size: 5.5vh; line-height: 1; color: var(--c, #475569); }
    .bolaGrande .n { font-size: 12.5vh; line-height: 1; letter-spacing: -.3vh; }
    .bolaGrande.nueva { animation: entra .9s cubic-bezier(.2, 1.4, .4, 1); }
    @keyframes entra { 0% { transform: scale(.3) rotate(-200deg); opacity: 0; } 100% { transform: scale(1) rotate(0); opacity: 1; } }
    #ultimas { display: flex; justify-content: center; gap: 1.2vh; margin-top: 1.4vh; min-height: 6.5vh; }
    .bolaChica {
      width: 6.5vh; height: 6.5vh; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at 50% 50%, #fff 0 50%, transparent 52%), var(--c);
      color: #0f172a; font-weight: 900; font-size: 3vh; box-shadow: inset -.5vh -.5vh .8vh rgba(0, 0, 0, .3);
    }
    #premioPanel { padding: 1.6vh 2vh; text-align: center; }
    #premioPanel .rotulo, #figuraPanel .rotulo { font-size: 2.6vh; font-weight: 800; color: #fde68a; }
    #premio { font-size: 6.5vh; font-weight: 900; color: #86efac; text-shadow: 0 .4vh 1vh rgba(0, 0, 0, .5); line-height: 1.1; }
    #figuraPanel { padding: 1.6vh 2vh; display: flex; align-items: center; gap: 2.4vh; min-height: 0; }
    #figuraNombre { font-size: 3.2vh; font-weight: 900; line-height: 1.1; }
    #figuraVariantes { font-size: 2.2vh; opacity: .8; margin-top: .6vh; }
    .mini { display: grid; grid-template-columns: repeat(5, 2.9vh); gap: .45vh; flex: 0 0 auto; }
    .mini div { height: 2.9vh; border-radius: .6vh; background: #1e293b; border: .15vh solid #475569; }
    .mini div.on { background: #fbbf24; border-color: #fde68a; }
    .mini div.centro { background: #7c3aed; }

    #tableroPanel { padding: 2vh 1.4vw; min-width: 0; display: grid; grid-template-rows: auto 1fr; min-height: 0; }
    #tableroPanel .cabecera { display: flex; justify-content: space-between; align-items: baseline; font-size: 3vh; font-weight: 800; color: #fde68a; margin-bottom: 1.4vh; }
    #tablero { display: grid; grid-template-columns: 6.5vh repeat(15, minmax(0, 1fr)); grid-template-rows: repeat(5, minmax(0, 1fr)); gap: .8vh; min-height: 0; }
    #tablero .letra {
      display: flex; align-items: center; justify-content: center; border-radius: 1.2vh;
      font-size: 6vh; font-weight: 900; color: #fff; background: var(--c); text-shadow: 0 .3vh .6vh rgba(0, 0, 0, .4);
    }
    #tablero .num {
      display: flex; align-items: center; justify-content: center; border-radius: 1.2vh;
      font-size: min(4.2vh, 2.3vw); font-weight: 900; color: rgba(203, 213, 225, .35); min-width: 0;
      background: rgba(30, 41, 59, .8); border: .2vh solid rgba(71, 85, 105, .7);
      transition: background .4s, color .4s, transform .4s;
    }
    #tablero .num.salio { background: var(--c); color: #fff; border-color: #fde68a; text-shadow: 0 .3vh .6vh rgba(0, 0, 0, .5); }
    #tablero .num.ultima { animation: late 1.2s ease-in-out infinite; box-shadow: 0 0 0 .5vh #fde68a; }
    @keyframes late { 50% { transform: scale(1.12); } }

    #anuncio {
      position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center;
      background: rgba(2, 6, 23, .78);
    }
    #anuncio.visible { display: flex; }
    #confeti { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
    #anuncio .caja {
      position: relative; z-index: 1; display: flex; align-items: center; gap: 4vw; max-width: 95vw;
      text-align: center; padding: 4vh 4vw; border-radius: 3vh; border: .6vh solid #fbbf24;
      background: linear-gradient(160deg, #16a34a, #15803d); box-shadow: 0 2vh 6vh rgba(0, 0, 0, .7);
      animation: entra .9s cubic-bezier(.2, 1.4, .4, 1);
    }
    #anuncio .texto { min-width: 0; max-width: 46vw; }
    #anuncio .bingo { font-size: 15vh; font-weight: 900; letter-spacing: 1vh; color: #fde68a; text-shadow: 0 .8vh 2vh rgba(0, 0, 0, .5); line-height: 1; }
    #anuncio .tabla { font-size: 7.5vh; font-weight: 900; margin-top: 2vh; line-height: 1.1; }
    #anuncio .nombre { font-size: 5.5vh; font-weight: 800; margin-top: 1.2vh; line-height: 1.15; overflow-wrap: anywhere; }
    #anuncio .detalle { font-size: 3.6vh; margin-top: 2vh; color: #fef9c3; }
    #anuncio .premioGanador { font-size: 8vh; font-weight: 900; margin-top: .6vh; color: #fde68a; text-shadow: 0 .5vh 1.2vh rgba(0, 0, 0, .45); line-height: 1.1; }
    .carton {
      flex: 0 0 auto; display: grid; grid-template-columns: repeat(5, 10.5vh); gap: .8vh; padding: 1.4vh;
      background: #fff; border-radius: 2vh; box-shadow: 0 1vh 3vh rgba(0, 0, 0, .45);
    }
    .carton[hidden] { display: none; }
    .carton div { display: flex; align-items: center; justify-content: center; border-radius: 1.2vh; font-weight: 900; }
    .carton .cab { height: 7vh; font-size: 5.5vh; color: #fff; background: var(--c); text-shadow: 0 .3vh .6vh rgba(0, 0, 0, .35); }
    .carton .c { height: 10.5vh; font-size: 5.2vh; color: #94a3b8; background: #f1f5f9; border: .3vh solid #cbd5e1; }
    .carton .c.salio { color: #fff; background: var(--c); border-color: var(--c); text-shadow: 0 .3vh .6vh rgba(0, 0, 0, .4); }
    .carton .c.fig { box-shadow: 0 0 0 .55vh #fbbf24; }
    .carton .c.gano {
      position: relative; z-index: 1; color: #7f1d1d; background: #fde68a; border-color: #dc2626; border-width: .6vh;
      box-shadow: 0 0 0 .55vh #fff, 0 0 3vh 1vh #fde68a; text-shadow: none; animation: latido 1.1s ease-in-out infinite;
    }
    @keyframes latido { 50% { transform: scale(1.14); } }
    #anuncio .conBalota {
      display: inline-flex; align-items: center; gap: 1.6vh; margin-top: 2vh; padding: 1vh 2.4vh 1vh 1vh;
      border-radius: 99vh; background: rgba(0, 0, 0, .28); font-size: 4.6vh; font-weight: 900; color: #fff;
    }
    #anuncio .conBalota .bolaGano small { font-size: 2.8vh; }
    #anuncio .conBalota[hidden] { display: none; }
    #anuncio .conBalota .bolaGano {
      width: 11vh; height: 11vh; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      flex-direction: column; line-height: 1; font-size: 5.4vh; font-weight: 900; color: #7f1d1d; background: radial-gradient(circle at 35% 30%, #fff, #fde68a 60%, #f59e0b);
      border: .6vh solid #dc2626; box-shadow: 0 .6vh 1.6vh rgba(0, 0, 0, .45); animation: latido 1.1s ease-in-out infinite;
    }
    .carton .c.centro { flex-direction: column; color: #fde68a; background: #7c3aed; border-color: #7c3aed; font-size: 3.6vh; line-height: 1; }
    .carton .c.centro small { font-size: 1.8vh; letter-spacing: .2vh; color: #ede9fe; margin-bottom: .4vh; }

    /* Sorteo adicional: capa propia, aparte del anuncio del bingo */
    #sorteoCapa {
      position: fixed; inset: 0; z-index: 21; display: none; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at 50% 40%, rgba(88, 28, 135, .88), rgba(2, 6, 23, .94) 70%);
    }
    #sorteoCapa.visible { display: flex; }
    #confetiSorteo { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
    #sorteoCapa .caja {
      position: relative; z-index: 1; width: min(84vw, 150vh); text-align: center; padding: 4vh 4vw; border-radius: 3vh;
      background: linear-gradient(160deg, rgba(76, 29, 149, .95), rgba(30, 27, 75, .95)); border: .6vh solid #fbbf24;
      box-shadow: 0 2vh 6vh rgba(0, 0, 0, .7); animation: entra .9s cubic-bezier(.2, 1.4, .4, 1);
    }
    #sorteoCapa .titulo { font-size: 5vh; font-weight: 900; letter-spacing: .8vh; color: #fde68a; text-shadow: 0 .5vh 1.2vh rgba(0, 0, 0, .5); }
    #sorteoPremioTv { font-size: 6vh; font-weight: 900; margin-top: 1vh; line-height: 1.1; overflow-wrap: anywhere; }
    #sorteoEntre { font-size: 2.8vh; color: #ddd6fe; margin-top: 1vh; }
    .tambor {
      position: relative; height: 42vh; margin: 3vh auto 0; width: min(70vw, 120vh); overflow: hidden; border-radius: 2.4vh;
      background: linear-gradient(#0f172a, #1e293b 50%, #0f172a); border: .4vh solid rgba(251, 191, 36, .6);
      box-shadow: inset 0 2vh 3vh rgba(0, 0, 0, .7), inset 0 -2vh 3vh rgba(0, 0, 0, .7);
    }
    .tambor[hidden] { display: none; }
    .tambor .ventana {
      position: absolute; left: 2%; right: 2%; top: 14vh; height: 14vh; border-radius: 1.6vh; z-index: 2; pointer-events: none;
      border: .6vh solid #fbbf24; box-shadow: 0 0 3vh rgba(251, 191, 36, .55), inset 0 0 2vh rgba(251, 191, 36, .25);
    }
    .tambor .sombra { position: absolute; inset: 0; z-index: 3; pointer-events: none;
      background: linear-gradient(rgba(15, 23, 42, .95), rgba(15, 23, 42, 0) 30%, rgba(15, 23, 42, 0) 70%, rgba(15, 23, 42, .95)); }
    .tambor .tira { position: absolute; left: 0; right: 0; top: 0; will-change: transform; }
    .tambor .tira div {
      height: 14vh; display: flex; align-items: center; justify-content: center;
      font-size: 10vh; font-weight: 900; letter-spacing: .6vh; color: #e2e8f0; font-variant-numeric: tabular-nums;
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    .tambor .tira div.gana { color: #fde68a; }
    #sorteoResultado[hidden] { display: none; }
    #sorteoResultado { margin-top: 3vh; animation: entra .9s cubic-bezier(.2, 1.4, .4, 1); }
    #sorteoResultado .gano { font-size: 4.4vh; font-weight: 900; color: #86efac; letter-spacing: .4vh; }
    #sorteoCodigoTv {
      display: inline-block; margin-top: 1.4vh; padding: 1.4vh 4vw; border-radius: 2vh; font-size: 15vh; font-weight: 900; line-height: 1;
      color: #7f1d1d; background: radial-gradient(circle at 35% 30%, #fff, #fde68a 60%, #f59e0b); border: .7vh solid #dc2626;
      box-shadow: 0 1vh 3vh rgba(0, 0, 0, .55); letter-spacing: .5vh; animation: latido 1.3s ease-in-out infinite;
    }
    #sorteoNombreTv { font-size: 6.5vh; font-weight: 800; margin-top: 2.4vh; line-height: 1.15; overflow-wrap: anywhere; }
    #sorteoNombreTv:empty { display: none; }

    /* Sonido */
    #sonidoPanel { position: fixed; inset: 0; z-index: 25; display: none; align-items: center; justify-content: center; background: rgba(2, 6, 23, .72); }
    #sonidoPanel.visible { display: flex; }
    #sonidoPanel .caja { text-align: center; padding: 5vh 5vw; border-radius: 3vh; background: rgba(15, 23, 42, .96); border: .4vh solid #fbbf24; box-shadow: 0 2vh 6vh rgba(0, 0, 0, .7); }
    #sonidoPanel h2 { margin: 0 0 1vh; font-size: 5vh; color: #fde68a; }
    #sonidoPanel p { margin: 0 0 3vh; font-size: 2.6vh; color: #cbd5e1; }
    #btnActivarSonido { font-size: 4.5vh; font-weight: 900; padding: 2.2vh 5vw; border: 0; border-radius: 2vh; color: #fff; cursor: pointer; background: linear-gradient(90deg, #16a34a, #22c55e); box-shadow: 0 1vh 2.5vh rgba(0, 0, 0, .5); }
    #btnSinSonido { display: block; margin: 2.4vh auto 0; font-size: 2.2vh; background: none; border: 0; color: #94a3b8; text-decoration: underline; cursor: pointer; }
    #btnSonido { position: fixed; left: 12vw; bottom: .8vh; z-index: 26; padding: .6vh 1vw; font-size: 1.8vh; font-weight: 800; border: 0; border-radius: .8vh; color: #fff; cursor: pointer; display: none; }
    #btnSonido.apagado { background: #b91c1c; opacity: .95; }
    #btnSonido.activo { background: rgba(22, 163, 74, .8); opacity: .7; }

    #conexion { position: fixed; right: 1vw; bottom: .6vh; font-size: 1.6vh; opacity: .5; z-index: 5; }
    #conexion.mal { opacity: 1; color: #fca5a5; font-weight: 800; font-size: 2.2vh; }
    #btnPantalla { position: fixed; left: 1vw; bottom: .8vh; z-index: 5; padding: .6vh 1vw; font-size: 1.6vh; border: 0; border-radius: .8vh; background: rgba(51, 65, 85, .7); color: #fff; opacity: .5; cursor: pointer; }

    /* Entrada */
    #login { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 30; }
    #login .caja { width: min(92vw, 440px); padding: 22px; background: rgba(15, 23, 42, .95); border: 2px solid #fbbf24; border-radius: 16px; }
    #login h2 { margin: 0 0 12px; color: #fde68a; }
    #login input { width: 100%; padding: 14px; font-size: 18px; border-radius: 10px; border: 1px solid #64748b; background: #1e293b; color: #fff; }
    #login button { width: 100%; margin-top: 12px; padding: 14px; font-size: 17px; font-weight: 700; border: 0; border-radius: 10px; background: #2563eb; color: #fff; cursor: pointer; }
    #login label { display: flex; gap: 8px; align-items: center; margin-top: 12px; font-size: 15px; }
    #loginError { color: #fca5a5; min-height: 1.2em; margin: 10px 0 0; }
  </style>
</head>
<body>
  <header>
    <div class="bolitas" aria-hidden="true"><span style="--c:#2563eb">B</span><span style="--c:#dc2626">I</span><span style="--c:#7c3aed">N</span><span style="--c:#16a34a">G</span><span style="--c:#f59e0b">O</span></div>
    <div class="titulo">Gran Bingo Municipal</div>
    <div class="info"><div id="ronda">Ronda –</div><div id="conteo">0 balotas</div></div>
  </header>

  <div id="juego">
    <div id="izquierda">
      <div id="actualPanel" class="panel">
        <div class="rotulo">Balota actual</div>
        <div class="bolaGrande" id="bolaActual"><span class="l">–</span><span class="n">–</span></div>
        <div id="ultimas"></div>
      </div>
      <div id="premioPanel" class="panel">
        <div class="rotulo">Premio</div>
        <div id="premio">–</div>
      </div>
      <div id="figuraPanel" class="panel">
        <div class="mini" id="figuraMini"></div>
        <div>
          <div class="rotulo">Figura</div>
          <div id="figuraNombre">–</div>
          <div id="figuraVariantes"></div>
        </div>
      </div>
    </div>
    <div id="tableroPanel" class="panel">
      <div class="cabecera"><span>Balotas que han salido</span><span id="faltan"></span></div>
      <div id="tablero"></div>
    </div>
  </div>

  <div id="anuncio">
    <canvas id="confeti"></canvas>
    <div class="caja">
      <div class="carton" id="anCarton" hidden></div>
      <div class="texto">
        <div class="bingo">¡BINGO!</div>
        <div class="tabla" id="anTabla"></div>
        <div class="nombre" id="anNombre"></div>
        <div class="conBalota" id="anConBalota" hidden><span class="bolaGano" id="anBolaGano"></span><span id="anTextoGano"></span></div>
        <div class="detalle" id="anDetalle"></div>
        <div class="premioGanador" id="anPremio"></div>
      </div>
    </div>
  </div>

  <div id="sorteoCapa">
    <canvas id="confetiSorteo"></canvas>
    <div class="caja">
      <div class="titulo">🎁 SORTEO</div>
      <div id="sorteoPremioTv"></div>
      <div id="sorteoEntre"></div>
      <div class="tambor" id="sorteoTambor"><div class="tira" id="sorteoTira"></div><div class="ventana"></div><div class="sombra"></div></div>
      <div id="sorteoResultado" hidden>
        <div class="gano">¡GANADOR!</div>
        <div id="sorteoCodigoTv"></div>
        <div id="sorteoNombreTv"></div>
      </div>
    </div>
  </div>

  <div id="sonidoPanel">
    <div class="caja">
      <h2>🔊 Sonido de la pantalla</h2>
      <p>El navegador necesita un toque para poder sonar al anunciar un ganador.</p>
      <button id="btnActivarSonido" onclick="activarSonido()">Activar sonido</button>
      <button id="btnSinSonido" onclick="seguirSinSonido()">Seguir sin sonido</button>
    </div>
  </div>

  <div id="conexion"></div>
  <button id="btnPantalla" onclick="pantallaCompleta()">Pantalla completa</button>
  <button id="btnSonido" class="apagado" onclick="alternarSonido()">🔇 Sin sonido · tocar para activar</button>

  <div id="login">
    <div class="caja">
      <h2>Clave de la pantalla</h2>
      <input type="password" id="clave" autocomplete="off">
      <label><input type="checkbox" id="recordar" style="width:auto"> Recordar en este equipo</label>
      <button id="btnEntrar" onclick="entrar()">Entrar</button>
      <p id="loginError"></p>
    </div>
  </div>

  <script>
    // URL del despliegue de Apps Script (termina en /exec)
    var API_URL = 'https://script.google.com/macros/s/AKfycbzcTqnNERnPIBRAhMR-EiVYOlCC26XBM8rbkWK1nVx3XOcs_ETcaOi1EVIS2GtLcl1m/exec';
    var INTERVALO_MS = 2000;
    var LETRAS = ['B', 'I', 'N', 'G', 'O'];
    var COLORES = { B: '#2563eb', I: '#dc2626', N: '#7c3aed', G: '#16a34a', O: '#f59e0b' };
    var COP = new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', maximumFractionDigits: 0, minimumFractionDigits: 0 });

    var clave = '';
    var ultimaV = null;
    var ultimaActual = null;
    var temporizador = null;
    var fallos = 0;
    var primerEstado = true;   // el primer estado tras abrir la página no suena
    var anunciosVistos = {};   // ganadores ya anunciados (para sonar una sola vez)

    function $(id) { return document.getElementById(id); }
    function letraDe(n) { return LETRAS[Math.floor((n - 1) / 15)]; }
    function bonito(n) { return String(n || '').toLowerCase().replace(/(^|\s)\S/g, function (c) { return c.toUpperCase(); }); }

    function llamarApi(datos) {
      var ctrl = new AbortController();
      var t = setTimeout(function () { ctrl.abort(); }, 15000);
      datos.clave = clave;
      return fetch(API_URL, {
        method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(datos), signal: ctrl.signal, cache: 'no-store'
      }).then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      }).finally(function () { clearTimeout(t); });
    }

    // ---------- Entrada ----------
    async function entrar() {
      var v = $('clave').value.trim();
      if (!v) return;
      $('btnEntrar').disabled = true;
      $('loginError').textContent = 'Verificando...';
      clave = v;
      try {
        var r = await llamarApi({ accion: 'validarClave' });
        if (r.estado !== 'clave_ok') { clave = ''; $('loginError').textContent = 'Clave incorrecta'; borrarGuardada(); return; }
        try {
          if ($('recordar').checked) localStorage.setItem('claveTv', v);
          sessionStorage.setItem('claveTv', v);
        } catch (e) {}
        $('loginError').textContent = '';
        $('login').style.display = 'none';
        mostrarAvisoSonido();
        construirTablero();
        sondear();
      } catch (e) {
        clave = '';
        $('loginError').textContent = 'Sin conexión. Reintentando...';
        setTimeout(entrar, 5000);
      } finally {
        $('btnEntrar').disabled = false;
      }
    }
    $('clave').addEventListener('keydown', function (ev) { if (ev.key === 'Enter') entrar(); });

    function borrarGuardada() {
      try { localStorage.removeItem('claveTv'); sessionStorage.removeItem('claveTv'); } catch (e) {}
    }

    // ---------- Polling cada 2 s (la siguiente consulta sale cuando termina la anterior) ----------
    async function sondear() {
      clearTimeout(temporizador);
      try {
        var r = await llamarApi({ accion: 'estado' });
        if (r.estado === 'clave') {
          borrarGuardada();
          clave = '';
          $('login').style.display = 'flex';
          $('loginError').textContent = 'La clave cambió. Escríbela de nuevo.';
          return;
        }
        if (r.estado === 'juego') {
          fallos = 0;
          // Se repinta si cambia el bingo (v) o el sorteo (vs).
          var version = r.v + '|' + (r.sorteo ? r.sorteo.vs : '');
          if (version !== ultimaV) { ultimaV = version; pintar(r); }
          conexion(true);
        } else {
          conexion(false, r.mensaje || 'Respuesta inesperada');
        }
      } catch (e) {
        fallos++;
        conexion(false, 'Sin conexión (reintentando)');
      }
      temporizador = setTimeout(sondear, fallos > 3 ? 5000 : INTERVALO_MS);
    }

    function conexion(bien, texto) {
      var c = $('conexion');
      c.className = bien ? '' : 'mal';
      var d = new Date();
      c.textContent = bien ? 'En línea · ' + ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2) + ':' + ('0' + d.getSeconds()).slice(-2) : texto;
    }

    // ---------- Pintar ----------
    function construirTablero() {
      var t = $('tablero');
      if (t.childNodes.length) return;
      LETRAS.forEach(function (L, f) {
        var l = document.createElement('div');
        l.className = 'letra';
        l.textContent = L;
        l.style.setProperty('--c', COLORES[L]);
        t.appendChild(l);
        for (var i = 1; i <= 15; i++) {
          var n = f * 15 + i;
          var d = document.createElement('div');
          d.className = 'num';
          d.id = 'n' + n;
          d.textContent = n;
          d.style.setProperty('--c', COLORES[L]);
          t.appendChild(d);
        }
      });
    }

    function pintar(r) {
      $('ronda').textContent = 'Ronda ' + r.ronda;
      $('conteo').textContent = r.balotas.length + (r.balotas.length === 1 ? ' balota' : ' balotas');
      $('faltan').textContent = (75 - r.balotas.length) + ' por salir';

      var a = r.actual;
      var bola = $('bolaActual');
      bola.style.setProperty('--c', a ? COLORES[letraDe(a)] : '#475569');
      bola.querySelector('.l').textContent = a ? letraDe(a) : '–';
      bola.querySelector('.n').textContent = a || '–';
      if (a && a !== ultimaActual) {
        bola.classList.remove('nueva');
        void bola.offsetWidth;
        bola.classList.add('nueva');
      }
      ultimaActual = a;

      var u = $('ultimas');
      u.textContent = '';
      r.balotas.slice(-6, -1).reverse().forEach(function (n) {
        var b = document.createElement('div');
        b.className = 'bolaChica';
        b.textContent = n;
        b.style.setProperty('--c', COLORES[letraDe(n)]);
        u.appendChild(b);
      });

      var salieron = {};
      r.balotas.forEach(function (n) { salieron[n] = true; });
      for (var n = 1; n <= 75; n++) {
        var c = $('n' + n);
        c.classList.toggle('salio', !!salieron[n]);
        c.classList.toggle('ultima', n === a);
      }

      $('premio').textContent = r.premio ? COP.format(r.premio) : 'Por anunciar';
      var f = r.figura;
      $('figuraNombre').textContent = f ? f.nombre : '–';
      $('figuraVariantes').textContent = f && f.mascaras.length > 1 ? 'Vale cualquiera de las ' + f.mascaras.length + ' formas' : '';
      var mini = $('figuraMini');
      mini.textContent = '';
      if (f) {
        for (var p = 0; p < 25; p++) {
          var d = document.createElement('div');
          d.className = p === 12 ? 'centro' : (f.mascaras[0].charAt(p) === '1' ? 'on' : '');
          mini.appendChild(d);
        }
      }

      var an = r.anuncio;
      $('anuncio').classList.toggle('visible', !!an);
      if (an) {
        $('anTabla').textContent = 'Tabla N° ' + tabla4(an.tabla);
        $('anNombre').textContent = bonito(an.nombre);
        $('anDetalle').textContent = an.figura || '';
        $('anPremio').textContent = an.premio ? COP.format(an.premio) : '';
        // Balota con la que completó la figura (guardada al confirmar; no cambia aunque se canten más).
        var cb = Number(an.conBalota) || 0;
        $('anConBalota').hidden = !cb;
        if (cb) {
          $('anBolaGano').innerHTML = '<small>' + letraDe(cb) + '</small>' + cb;
          $('anTextoGano').textContent = 'Ganó con la balota ' + letraDe(cb) + '-' + cb;
        }
        pintarCarton(an, salieron);
        // Sonido una sola vez por ganador confirmado; nunca por un anuncio que ya estaba al abrir la página.
        var id = idAnuncio(an);
        if (!anunciosVistos[id]) {
          anunciosVistos[id] = true;
          if (!primerEstado) { celebrar(); alFrente('anuncio'); }
        }
        confeti.iniciar();
      } else {
        confeti.detener();
      }
      pintarSorteo(r.sorteo);
      primerEstado = false;
    }

    // ---------- Sorteo adicional ----------
    // Capa propia: no toca el anuncio del bingo. Si conviven, queda adelante el más reciente.
    var sorteoMostrado = null, sorteosVistos = {}, sorteoAnim = null, sorteoTimers = [];
    var DURACION_TAMBOR = 7000;

    function alFrente(cual) {
      $('anuncio').style.zIndex = cual === 'anuncio' ? 22 : 20;
      $('sorteoCapa').style.zIndex = cual === 'sorteo' ? 22 : 21;
    }

    function pararSorteo() {
      cancelAnimationFrame(sorteoAnim); sorteoAnim = null;
      sorteoTimers.forEach(clearTimeout); sorteoTimers = [];
    }

    function pintarSorteo(so) {
      var a = so && so.anuncio;
      if (!a) {
        if (sorteoMostrado !== null) { pararSorteo(); confetiSorteo.detener(); }
        sorteoMostrado = null;
        $('sorteoCapa').classList.remove('visible');
        return;
      }
      var uid = a.uid || String(a.id);
      if (sorteoMostrado === uid) return;   // ya se está mostrando (o girando)
      pararSorteo();
      confetiSorteo.detener();
      sorteoMostrado = uid;
      $('sorteoPremioTv').textContent = a.premio;
      var quienes = a.filtro === 'mujeres' ? (a.participantes === 1 ? ' mujer' : ' mujeres') : a.filtro === 'hombres' ? (a.participantes === 1 ? ' hombre' : ' hombres') : (a.participantes === 1 ? ' participante' : ' participantes');
      $('sorteoEntre').textContent = 'Entre ' + a.participantes + quienes + ' con ingreso registrado';
      $('sorteoCapa').classList.add('visible');
      alFrente('sorteo');
      // Al abrir la página (o si ya se vio) se muestra el resultado directo, sin girar ni sonar.
      if (primerEstado || sorteosVistos[uid]) { sorteosVistos[uid] = true; revelarSorteo(a); return; }
      sorteosVistos[uid] = true;
      girarTambor(a);
    }

    // Tambor de códigos que se va frenando hasta dejar el del ganador en la ventana dorada.
    function girarTambor(a) {
      $('sorteoResultado').hidden = true;
      $('sorteoTambor').hidden = false;
      var pool = (a.ruleta && a.ruleta.length) ? a.ruleta : [a.codigo];
      var N = 46, gana = N - 2, items = [];
      for (var i = 0; i < N; i++) items.push(i === gana ? a.codigo : pool[Math.floor(Math.random() * pool.length)]);
      var tira = $('sorteoTira');
      tira.textContent = '';
      items.forEach(function (c, i) { var d = document.createElement('div'); d.textContent = c; tira.appendChild(d); });
      var alto = tira.firstChild.getBoundingClientRect().height;
      var fin = (gana - 1) * alto;            // el ganador queda en la fila del medio (ventana)
      var inicio = performance.now();
      tira.style.transform = 'translateY(0)';
      function paso(ahora) {
        var t = Math.min(1, (ahora - inicio) / DURACION_TAMBOR);
        var e = 1 - Math.pow(1 - t, 4);       // rápido al principio, se va frenando
        tira.style.transform = 'translateY(' + (-fin * e).toFixed(1) + 'px)';
        if (t < 1) sorteoAnim = requestAnimationFrame(paso);
        else { sorteoAnim = null; tira.children[gana].className = 'gana'; sorteoTimers.push(setTimeout(function () { revelarSorteo(a); }, 700)); }
      }
      sorteoAnim = requestAnimationFrame(paso);
      // El mismo redoble del bingo: el platillo coincide con el final del tambor. Una sola vez por sorteo.
      if (sonidoActivo) sorteoTimers.push(setTimeout(function () { try { redoble(); } catch (e) {} }, Math.max(0, DURACION_TAMBOR - 2350)));
    }

    function revelarSorteo(a) {
      $('sorteoTambor').hidden = true;
      $('sorteoCodigoTv').textContent = a.codigo;
      $('sorteoNombreTv').textContent = a.nombre ? bonito(a.nombre) : '';
      $('sorteoResultado').hidden = false;
      confetiSorteo.iniciar();
    }

    function tabla4(n) { return String(n).padStart(4, '0'); }
    function idAnuncio(an) { return [an.ronda, an.tabla, an.hora, an.balotas].join('|'); }

    // Cartón del ganador: balotas que salieron pintadas, figura con borde dorado y centro libre con el N° de tabla.
    function pintarCarton(an, salieron) {
      var c = $('anCarton');
      c.textContent = '';
      var g = an.grilla;
      if (!g || g.length !== 25) { c.hidden = true; return; }
      c.hidden = false;
      LETRAS.forEach(function (L) {
        var h = document.createElement('div');
        h.className = 'cab';
        h.textContent = L;
        h.style.setProperty('--c', COLORES[L]);
        c.appendChild(h);
      });
      var m = String(an.mascara || '');
      for (var p = 0; p < 25; p++) {
        var d = document.createElement('div');
        var col = LETRAS[p % 5];
        d.style.setProperty('--c', COLORES[col]);
        if (p === 12) {
          d.className = 'c centro';
          d.innerHTML = '<small>LIBRE</small>';
          d.appendChild(document.createTextNode(tabla4(an.tabla)));
        } else {
          d.className = 'c' + (salieron[g[p]] ? ' salio' : '') + (m.charAt(p) === '1' ? ' fig' : '') +
            (an.conBalota && Number(g[p]) === Number(an.conBalota) ? ' gano' : '');
          d.textContent = g[p];
        }
        c.appendChild(d);
      }
    }

    // ---------- Confeti (canvas, sin librerías) ----------
    function crearConfeti(lienzo) {
      var ctx = lienzo.getContext('2d');
      var piezas = [], activo = false, cuadro = null, ancho = 0, alto = 0;
      var TONOS = ['#fbbf24', '#f43f5e', '#22c55e', '#3b82f6', '#a855f7', '#f97316', '#fde68a', '#ffffff'];
      function medir() {
        var r = window.devicePixelRatio || 1;
        ancho = lienzo.clientWidth; alto = lienzo.clientHeight;
        lienzo.width = Math.round(ancho * r); lienzo.height = Math.round(alto * r);
        ctx.setTransform(r, 0, 0, r, 0, 0);
      }
      function nueva(arriba) {
        return {
          x: Math.random() * ancho, y: arriba ? -20 - Math.random() * alto * 0.3 : Math.random() * alto,
          w: 6 + Math.random() * 9, h: 8 + Math.random() * 12, vx: -1.2 + Math.random() * 2.4, vy: 1.6 + Math.random() * 3.2,
          giro: Math.random() * 6.28, vg: -0.12 + Math.random() * 0.24, osc: Math.random() * 6.28,
          color: TONOS[Math.floor(Math.random() * TONOS.length)], redonda: Math.random() < 0.25
        };
      }
      function paso() {
        if (!activo) return;
        ctx.clearRect(0, 0, ancho, alto);
        for (var i = 0; i < piezas.length; i++) {
          var p = piezas[i];
          p.osc += 0.05; p.x += p.vx + Math.sin(p.osc) * 0.8; p.y += p.vy; p.giro += p.vg;
          if (p.y > alto + 30) piezas[i] = nueva(true);
          ctx.save();
          ctx.translate(p.x, p.y); ctx.rotate(p.giro); ctx.scale(1, Math.cos(p.osc * 1.6));
          ctx.fillStyle = p.color;
          if (p.redonda) { ctx.beginPath(); ctx.arc(0, 0, p.w / 2, 0, 6.28); ctx.fill(); }
          else ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          ctx.restore();
        }
        cuadro = requestAnimationFrame(paso);
      }
      window.addEventListener('resize', function () { if (activo) medir(); });
      return {
        iniciar: function () {
          if (activo) return;
          activo = true; medir();
          piezas = [];
          var n = Math.min(260, Math.round(ancho * alto / 7000));
          for (var i = 0; i < n; i++) piezas.push(nueva(i % 2 === 0));
          cuadro = requestAnimationFrame(paso);
        },
        detener: function () {
          activo = false; cancelAnimationFrame(cuadro); piezas = [];
          ctx.clearRect(0, 0, ancho, alto);
        },
        activo: function () { return activo; }
      };
    }
    var confeti = crearConfeti($('confeti'));
    var confetiSorteo = crearConfeti($('confetiSorteo'));

    // ---------- Sonido ----------
    // Los navegadores no dejan sonar una página hasta que alguien la toca: se pide un toque al entrar.
    var audioCtx = null, sonidoActivo = false, audioMp3 = null, ruidoBuf = null;

    // Si existe docs/audio/bingo.mp3 se usa en lugar de la voz del navegador.
    fetch('audio/bingo.mp3', { method: 'HEAD', cache: 'no-store' }).then(function (r) {
      var tipo = r.headers.get('content-type') || '';
      if (r.ok && !/html/i.test(tipo)) { audioMp3 = new Audio('audio/bingo.mp3'); audioMp3.preload = 'auto'; }
    }).catch(function () {});

    function mostrarAvisoSonido() {
      if (!sonidoActivo) $('sonidoPanel').classList.add('visible');
      $('btnSonido').style.display = 'block';
    }
    function marcarSonido(on) {
      sonidoActivo = on;
      var b = $('btnSonido');
      b.className = on ? 'activo' : 'apagado';
      b.textContent = on ? '🔊 Sonido activo' : '🔇 Sin sonido · tocar para activar';
    }
    function activarSonido() {
      try {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (AC && !audioCtx) audioCtx = new AC();
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        if (audioCtx) { // pulso silencioso para desbloquear la salida
          var s = audioCtx.createBufferSource();
          s.buffer = audioCtx.createBuffer(1, 1, 22050);
          s.connect(audioCtx.destination); s.start(0);
        }
        if (window.speechSynthesis) { var u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); }
        if (audioMp3) { audioMp3.muted = true; var pr = audioMp3.play(); if (pr) pr.then(function () { audioMp3.pause(); audioMp3.currentTime = 0; audioMp3.muted = false; }).catch(function () { audioMp3.muted = false; }); }
      } catch (e) {}
      marcarSonido(true);
      $('sonidoPanel').classList.remove('visible');
    }
    function seguirSinSonido() { marcarSonido(false); $('sonidoPanel').classList.remove('visible'); }
    function alternarSonido() { if (sonidoActivo) marcarSonido(false); else activarSonido(); }

    function celebrar() {
      if (!sonidoActivo) return;
      var espera = 0;
      try { espera = redoble(); } catch (e) {}
      setTimeout(decirBingo, espera * 1000);
    }

    // Redoble de tambor con Web Audio: golpes de ruido filtrado cada vez más rápidos y fuertes, y un platillo al final.
    function redoble() {
      if (!audioCtx) return 0;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      var ac = audioCtx;
      if (!ruidoBuf) {
        ruidoBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
        var d = ruidoBuf.getChannelData(0);
        for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      }
      var salida = ac.createGain();
      salida.gain.value = 0.9;
      salida.connect(ac.destination);
      var t0 = ac.currentTime + 0.05, dur = 2.3, t = t0;
      while (t < t0 + dur) {
        var p = (t - t0) / dur;
        golpe(t, 0.12 + 0.55 * p * p);
        t += 0.075 - 0.04 * p + Math.random() * 0.006;
      }
      // Bombo + platillo final
      var fin = t0 + dur;
      var o = ac.createOscillator(), go = ac.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(150, fin); o.frequency.exponentialRampToValueAtTime(45, fin + 0.35);
      go.gain.setValueAtTime(1, fin); go.gain.exponentialRampToValueAtTime(0.001, fin + 0.6);
      o.connect(go); go.connect(salida); o.start(fin); o.stop(fin + 0.65);
      var pl = ac.createBufferSource(), hp = ac.createBiquadFilter(), gp = ac.createGain();
      pl.buffer = ruidoBuf; pl.loop = true;
      hp.type = 'highpass'; hp.frequency.value = 5000;
      gp.gain.setValueAtTime(0.0001, fin); gp.gain.exponentialRampToValueAtTime(0.6, fin + 0.01); gp.gain.exponentialRampToValueAtTime(0.001, fin + 1.8);
      pl.connect(hp); hp.connect(gp); gp.connect(salida); pl.start(fin); pl.stop(fin + 1.9);
      return dur + 0.45;

      function golpe(tt, vol) {
        var s = ac.createBufferSource(), bp = ac.createBiquadFilter(), g = ac.createGain();
        s.buffer = ruidoBuf;
        bp.type = 'bandpass'; bp.frequency.value = 1700 + Math.random() * 300; bp.Q.value = 0.8;
        g.gain.setValueAtTime(0.0001, tt); g.gain.exponentialRampToValueAtTime(vol, tt + 0.004); g.gain.exponentialRampToValueAtTime(0.001, tt + 0.1);
        s.connect(bp); bp.connect(g); g.connect(salida);
        s.start(tt, Math.random() * 0.8, 0.12);
        var tono = ac.createOscillator(), gt = ac.createGain(); // cuerpo del tambor
        tono.type = 'triangle'; tono.frequency.value = 185;
        gt.gain.setValueAtTime(vol * 0.35, tt); gt.gain.exponentialRampToValueAtTime(0.001, tt + 0.07);
        tono.connect(gt); gt.connect(salida); tono.start(tt); tono.stop(tt + 0.08);
      }
    }

    function decirBingo() {
      if (audioMp3) {
        audioMp3.currentTime = 0;
        var pr = audioMp3.play();
        if (pr) pr.catch(hablarBingo);
        return;
      }
      hablarBingo();
    }
    function hablarBingo() {
      if (!window.speechSynthesis) return;
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance('¡Bingo!');
      u.lang = 'es-CO'; u.rate = 0.9; u.pitch = 1.1; u.volume = 1;
      var voces = speechSynthesis.getVoices().filter(function (v) { return /^es/i.test(v.lang); });
      var pref = ['es-CO', 'es-MX', 'es-US', 'es-419', 'es-ES'];
      voces.sort(function (a, b) {
        var ia = pref.indexOf(a.lang.replace('_', '-')), ib = pref.indexOf(b.lang.replace('_', '-'));
        return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
      });
      if (voces[0]) { u.voice = voces[0]; u.lang = voces[0].lang; }
      speechSynthesis.speak(u);
    }
    if (window.speechSynthesis) { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = function () { speechSynthesis.getVoices(); }; }

    function pantallaCompleta() {
      var d = document.documentElement;
      if (!document.fullscreenElement && d.requestFullscreen) d.requestFullscreen().catch(function () {});
      else if (document.exitFullscreen) document.exitFullscreen().catch(function () {});
    }

    // Entrada automática si la clave está guardada en este equipo.
    (function () {
      var g = null;
      try { g = localStorage.getItem('claveTv') || sessionStorage.getItem('claveTv'); if (localStorage.getItem('claveTv')) $('recordar').checked = true; } catch (e) {}
      if (g) { $('clave').value = g; entrar(); }
    })();
  </script>
</body>
